{% extends "base.html" %}
{% block title %}Prompts — LegalMind{% endblock %}
{% block content %}
<style>
    /* Override content-wrap padding for full-height two-column layout */
    #main-content { padding: 0; overflow: hidden; display: flex; flex-direction: column; }

    /* Prompt sidebar row */
    .prompt-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 12px;
        color: rgb(var(--body-secondary));
        background: transparent;
        border: none;
        cursor: pointer;
        text-align: left;
        transition: background 100ms, color 100ms;
        position: relative;
    }
    .prompt-row:hover { background: rgb(var(--ink-800)); color: rgb(var(--body-primary)); }
    .prompt-row.active {
        background: rgb(var(--ink-800));
        color: rgb(var(--body-primary));
        border-left: 2px solid rgb(var(--gold));
        padding-left: 8px;
    }
    .prompt-row .dirty-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: rgb(var(--signal-warn));
        flex-shrink: 0;
        display: none;
    }
    .prompt-row.dirty .dirty-dot { display: block; }

    /* Family section label */
    .family-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: rgb(var(--body-muted));
        padding: 10px 10px 4px;
    }

    /* Full-height split */
    .prompts-layout {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
    }
    .prompts-sidebar {
        width: 288px;
        flex-shrink: 0;
        background: rgb(var(--ink-900));
        border-right: 1px solid rgb(var(--ink-800));
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .prompts-sidebar-head {
        padding: 14px 14px 10px;
        border-bottom: 1px solid rgb(var(--ink-800));
        flex-shrink: 0;
    }
    .prompts-sidebar-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px 8px;
    }
    .prompts-sidebar-list::-webkit-scrollbar { width: 4px; }
    .prompts-sidebar-list::-webkit-scrollbar-track { background: transparent; }
    .prompts-sidebar-list::-webkit-scrollbar-thumb { background: rgb(var(--ink-700)); border-radius: 2px; }

    .prompts-editor {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: rgb(var(--ink-950));
    }
    .editor-topbar {
        flex-shrink: 0;
        padding: 12px 20px;
        border-bottom: 1px solid rgb(var(--ink-800));
        background: rgb(var(--ink-900));
        display: flex;
        align-items: flex-start;
        gap: 14px;
    }
    .editor-statusline {
        flex-shrink: 0;
        padding: 5px 20px;
        border-bottom: 1px solid rgb(var(--ink-800));
        font-size: 11px;
        color: rgb(var(--body-muted));
        font-family: 'JetBrains Mono', monospace;
        background: rgb(var(--ink-900));
        display: flex;
        align-items: center;
        gap: 12px;
    }
    #pr-textarea {
        flex: 1;
        width: 100%;
        background: rgb(var(--ink-950));
        border: none;
        outline: none;
        resize: none;
        color: rgb(var(--body-primary));
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 12px;
        line-height: 1.6;
        padding: 16px 20px;
    }
    #pr-textarea:focus { outline: none; }
</style>

<!-- Full-height layout wrapper -->
<div class="prompts-layout">

    <!-- ═══════════════════ LEFT SIDEBAR ═══════════════════ -->
    <aside class="prompts-sidebar">
        <div class="prompts-sidebar-head">
            <p class="card-head" style="margin-bottom:10px;">Prompt Files</p>
            <input id="pr-search" type="text" class="input" placeholder="Search prompts…"
                   style="font-size:12px;padding:6px 10px;" autocomplete="off" spellcheck="false">
            <p id="pr-count" style="font-size:10px;color:rgb(var(--body-muted));margin-top:6px;"></p>
        </div>

        <div class="prompts-sidebar-list" id="pr-sidebar-scroll">
            <div id="pr-loading" style="padding:16px 10px;font-size:12px;color:rgb(var(--body-muted));">
                Loading prompts…
            </div>
            <div id="pr-groups"></div>
            <div id="pr-empty-list" style="display:none;padding:16px 10px;font-size:12px;color:rgb(var(--body-muted));">
                No prompts match the filter.
            </div>
        </div>
    </aside>

    <!-- ═══════════════════ RIGHT EDITOR ═══════════════════ -->
    <div class="prompts-editor">

        <!-- Empty state (no prompt selected) -->
        <div id="pr-empty-state" class="empty-state" style="flex:1;">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5"/>
                <path d="M17.586 3.586a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
            <p style="font-size:14px;font-weight:500;color:rgb(var(--body-secondary));margin-bottom:6px;">No prompt selected</p>
            <p style="font-size:12px;color:rgb(var(--body-muted));">Choose a prompt from the sidebar to view and edit it.</p>
        </div>

        <!-- Editor pane (shown when a prompt is loaded) -->
        <div id="pr-editor-pane" style="display:none;flex:1;flex-direction:column;overflow:hidden;">

            <!-- Editor toolbar -->
            <div class="editor-topbar">
                <div style="flex:1;min-width:0;">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <span id="pr-title" style="font-size:14px;font-weight:600;color:rgb(var(--body-primary));"></span>
                        <span id="pr-managed-badge" class="badge badge-warn" style="display:none;"
                              title="Managed prompts require care when editing">MANAGED</span>
                        <span id="pr-dirty-badge" class="badge badge-warn" style="display:none;">&#9679; Unsaved</span>
                    </div>
                    <p id="pr-path" style="font-size:11px;color:rgb(var(--body-muted));font-family:'JetBrains Mono',monospace;margin-top:3px;"></p>
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                    <button id="pr-revert" class="btn btn-ghost btn-sm" onclick="revertPrompt()">Revert</button>
                    <button id="pr-save" class="btn btn-primary btn-sm" onclick="savePrompt()">Save</button>
                </div>
            </div>

            <!-- Status line -->
            <div class="editor-statusline">
                <span id="pr-status-text">Ready</span>
                <span id="pr-char-count" style="margin-left:auto;"></span>
            </div>

            <!-- Textarea -->
            <textarea id="pr-textarea" spellcheck="false" autocomplete="off"
                      placeholder="Prompt content will appear here…"></textarea>
        </div>

    </div><!-- /prompts-editor -->
</div><!-- /prompts-layout -->

<script>
(function () {
    'use strict';

    let _activeId  = null;
    let _loadedRaw = '';
    let _list      = [];
    let _search    = '';
    let _dirty     = false;

    /* ─── Fetch list ──────────────────────────────────────────────── */
    async function loadList() {
        try {
            const r = await fetch('/api/v1/prompts');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const d = await r.json();
            _list = d.prompts || [];
        } catch (e) {
            _list = [];
            document.getElementById('pr-loading').textContent = 'Failed to load: ' + e.message;
            return;
        }
        document.getElementById('pr-loading').style.display = 'none';
        const cnt = document.getElementById('pr-count');
        if (cnt) cnt.textContent = _list.length + ' file' + (_list.length !== 1 ? 's' : '');
        renderSidebar();
    }

    /* ─── Render sidebar ──────────────────────────────────────────── */
    function renderSidebar() {
        const root    = document.getElementById('pr-groups');
        const emptyEl = document.getElementById('pr-empty-list');
        root.innerHTML = '';

        const q = _search.toLowerCase();
        const groups = {};
        for (const p of _list) {
            if (q && !p.id.toLowerCase().includes(q) && !(p.description || '').toLowerCase().includes(q)) continue;
            const fam = p.family || p.type || 'other';
            (groups[fam] = groups[fam] || []).push(p);
        }

        const ORDER = ['extraction','retrieval','generation','verification','learning','other'];
        const all   = Object.keys(groups);
        const ordered = ORDER.filter(f => all.includes(f)).concat(all.filter(f => !ORDER.includes(f)));

        if (ordered.length === 0) {
            emptyEl.style.display = '';
            return;
        }
        emptyEl.style.display = 'none';

        for (const fam of ordered) {
            const items = groups[fam];
            if (!items || !items.length) continue;

            const famLabel = document.createElement('div');
            famLabel.className = 'family-label';
            famLabel.textContent = fam + ' (' + items.length + ')';
            root.appendChild(famLabel);

            for (const p of items) {
                const btn = document.createElement('button');
                btn.className = 'prompt-row' + (p.id === _activeId ? ' active' : '') + (_dirty && p.id === _activeId ? ' dirty' : '');
                btn.dataset.id = p.id;
                btn.title = p.id;
                btn.innerHTML =
                    '<span class="dirty-dot"></span>' +
                    '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(p.id) + '</span>' +
                    (p.managed ? '<span class="badge badge-warn" style="font-size:9px;padding:1px 5px;flex-shrink:0;">M</span>' : '');
                btn.addEventListener('click', () => loadPrompt(p.id));
                root.appendChild(btn);
            }
        }
    }

    /* ─── Load a prompt ───────────────────────────────────────────── */
    async function loadPrompt(id) {
        if (_dirty && _activeId && _activeId !== id) {
            const ok = await legalModal({
                title: 'Unsaved Changes',
                body: 'You have unsaved changes in "' + _activeId + '".\nDiscard and open "' + id + '"?',
                confirmLabel: 'Discard & Open',
                danger: true,
            });
            if (!ok) return;
        }

        _activeId = id;
        _dirty    = false;
        updateDirtyUI();
        renderSidebar();

        // Show editor pane
        document.getElementById('pr-empty-state').style.display = 'none';
        const pane = document.getElementById('pr-editor-pane');
        pane.style.display = 'flex';

        document.getElementById('pr-status-text').textContent = 'Loading…';

        let d;
        try {
            const r = await fetch('/api/v1/prompts/' + encodeURIComponent(id));
            if (!r.ok) throw new Error('HTTP ' + r.status);
            d = await r.json();
        } catch (e) {
            document.getElementById('pr-status-text').textContent = 'Load failed: ' + e.message;
            return;
        }

        _loadedRaw = d.raw || d.content || '';

        const ta = document.getElementById('pr-textarea');
        ta.value    = _loadedRaw;
        ta.readOnly = !!d.managed;
        ta.style.opacity = d.managed ? '0.7' : '1';

        document.getElementById('pr-title').textContent =
            (d.frontmatter && d.frontmatter.title) || id;
        document.getElementById('pr-path').textContent =
            d.file_path || ('prompts/' + id);
        document.getElementById('pr-managed-badge').style.display =
            d.managed ? '' : 'none';

        const now = new Date().toLocaleTimeString();
        const bytes = d.size_bytes != null ? d.size_bytes : _loadedRaw.length;
        document.getElementById('pr-status-text').textContent =
            'Loaded ' + bytes + ' bytes · ' + now + (d.frontmatter && d.frontmatter.description ? ' · ' + d.frontmatter.description : '');
        updateCharCount();

        // Deep-link: update URL without navigation
        const url = new URL(window.location);
        url.searchParams.set('id', id);
        history.replaceState(null, '', url);
    }

    /* ─── Save ────────────────────────────────────────────────────── */
    async function savePrompt() {
        if (!_activeId) return;
        const ta  = document.getElementById('pr-textarea');
        const btn = document.getElementById('pr-save');
        btn.disabled   = true;
        btn.textContent = 'Saving…';
        try {
            const r = await fetch('/api/v1/prompts/' + encodeURIComponent(_activeId), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: ta.value }),
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
            _loadedRaw = ta.value;
            _dirty     = false;
            updateDirtyUI();
            const bytes = data.size_bytes != null ? data.size_bytes : ta.value.length;
            document.getElementById('pr-status-text').textContent =
                'Saved ' + bytes + ' bytes at ' + new Date().toLocaleTimeString();
            showToast('Prompt saved.', 'ok');
            renderSidebar();
        } catch (e) {
            document.getElementById('pr-status-text').textContent = 'Save failed: ' + e.message;
            showToast('Save failed: ' + e.message, 'error');
        } finally {
            btn.disabled    = false;
            btn.textContent = 'Save';
        }
    }

    /* ─── Revert ──────────────────────────────────────────────────── */
    async function revertPrompt() {
        if (!_activeId) return;
        if (_dirty) {
            const ok = await legalModal({
                title: 'Revert Prompt',
                body: 'Discard unsaved changes and reload from disk?',
                confirmLabel: 'Revert',
                danger: true,
            });
            if (!ok) return;
        }
        await loadPrompt(_activeId);
    }

    /* ─── Dirty tracking ──────────────────────────────────────────── */
    function updateDirtyUI() {
        document.getElementById('pr-dirty-badge').style.display = _dirty ? '' : 'none';
        document.getElementById('pr-save').disabled = !_dirty;
        // Mark active row dirty
        document.querySelectorAll('.prompt-row').forEach(el => {
            if (el.dataset.id === _activeId) {
                el.classList.toggle('dirty', _dirty);
            }
        });
    }

    function updateCharCount() {
        const ta = document.getElementById('pr-textarea');
        const el = document.getElementById('pr-char-count');
        if (el && ta) el.textContent = ta.value.length.toLocaleString() + ' chars';
    }

    document.getElementById('pr-textarea').addEventListener('input', function () {
        const wasDirty = _dirty;
        _dirty = (this.value !== _loadedRaw);
        if (wasDirty !== _dirty) updateDirtyUI();
        updateCharCount();
    });

    /* ─── Search filter ───────────────────────────────────────────── */
    document.getElementById('pr-search').addEventListener('input', function () {
        _search = this.value;
        renderSidebar();
    });

    /* ─── Keyboard shortcuts ──────────────────────────────────────── */
    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            // Only if editor is active
            if (_activeId) { e.preventDefault(); savePrompt(); }
        }
    });

    /* ─── Deep-link auto-open ─────────────────────────────────────── */
    async function autoOpenFromQuery() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) return;
        // Wait for sidebar to populate
        for (let i = 0; i < 40 && !document.querySelector('[data-id]'); i++) {
            await new Promise(res => setTimeout(res, 80));
        }
        await loadPrompt(id);
    }

    /* ─── Expose for external calls ──────────────────────────────── */
    window.loadPrompt   = loadPrompt;
    window.savePrompt   = savePrompt;
    window.revertPrompt = revertPrompt;

    /* ─── Init ────────────────────────────────────────────────────── */
    // Save button starts disabled (no unsaved changes yet)
    document.getElementById('pr-save').disabled = true;

    loadList().then(autoOpenFromQuery);

    function escHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
})();
</script>
{% endblock %}
