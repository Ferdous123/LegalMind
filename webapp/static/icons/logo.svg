<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="LegalMind">
  <!-- Hexagonal background -->
  <polygon
    points="16,2 28,8.5 28,23.5 16,30 4,23.5 4,8.5"
    fill="#1e40af"
    stroke="none"
  />
  <!-- Inner hexagon outline (lighter tone for depth) -->
  <polygon
    points="16,5.5 25,10.5 25,21.5 16,26.5 7,21.5 7,10.5"
    fill="none"
    stroke="#3b82f6"
    stroke-width="0.75"
    opacity="0.5"
  />
  <!-- Scale beam (horizontal bar) -->
  <line x1="10" y1="15" x2="22" y2="15" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Scale center post -->
  <line x1="16" y1="11.5" x2="16" y2="21" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Left scale pan -->
  <line x1="10" y1="15" x2="10" y2="18" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="10" cy="18.8" rx="2.2" ry="0.8" fill="none" stroke="#ffffff" stroke-width="1" />
  <!-- Right scale pan -->
  <line x1="22" y1="15" x2="22" y2="18" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="22" cy="18.8" rx="2.2" ry="0.8" fill="none" stroke="#ffffff" stroke-width="1" />
  <!-- Document lines (small, above the scale — suggesting a brief/document) -->
  <line x1="13.5" y1="12" x2="18.5" y2="12" stroke="#93c5fd" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="14.5" y1="13.5" x2="17.5" y2="13.5" stroke="#93c5fd" stroke-width="0.9" stroke-linecap="round"/>
</svg>
